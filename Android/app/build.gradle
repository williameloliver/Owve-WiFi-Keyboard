plugins { id 'com.android.application' }

android {
    namespace 'cl.owve.wifikeyboard'
    compileSdk 34

    defaultConfig {
        applicationId 'cl.owve.wifikeyboard'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
